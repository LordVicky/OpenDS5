# Always bring the virtual DualSense card up in pro-audio so the 4-channel
# speaker+haptics sink exists deterministically after every reconnect.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Sony_Interactive_Entertainment_DualSense.*" }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  }
]
