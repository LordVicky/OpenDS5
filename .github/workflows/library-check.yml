name: library-check

on:
  pull_request:
    branches: [Profiles-Library]
    paths:
      - 'profiles/**'
      - 'scripts/build-index.mjs'
      - 'scripts/validate-profile.mts'
  push:
    branches: [Profiles-Library]
    paths:
      - 'profiles/**'
      - 'scripts/build-index.mjs'
      - 'scripts/validate-profile.mts'

jobs:
  library-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify library index is in sync and profiles are valid
        run: node scripts/build-index.mjs --check
